<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>付け回し管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #08080e;
  --panel:   #0f0f18;
  --card:    #13131c;
  --card-b:  #252535;
  --gold:    #c9a84c;
  --purple:  #a78bfa;
  --text:    #ddd5c8;
  --muted:   #55526a;
  --warn-bg: #2a1800;
  --warn:    #f59e0b;
  --dead-bg: #200808;
  --dead:    #ef4444;
  --ext-bg:  #071a10;
  --ext:     #22c55e;
  --checkin: #0a1428;
  --checkin-b:#3b82f6;
  --mono: 'Share Tech Mono', monospace;
  --sans: 'Noto Sans JP', sans-serif;
}
/* 被り色 12色 */
.dc0{color:#f43f5e!important;}.dc1{color:#fb923c!important;}
.dc2{color:#fbbf24!important;}.dc3{color:#4ade80!important;}
.dc4{color:#22d3ee!important;}.dc5{color:#818cf8!important;}
.dc6{color:#f472b6!important;}.dc7{color:#34d399!important;}
.dc8{color:#60a5fa!important;}.dc9{color:#c084fc!important;}
.dc10{color:#fca5a5!important;}.dc11{color:#86efac!important;}
.dcb0{border-color:#f43f5e!important;background:#28000a!important;}
.dcb1{border-color:#fb923c!important;background:#281000!important;}
.dcb2{border-color:#fbbf24!important;background:#281e00!important;}
.dcb3{border-color:#4ade80!important;background:#002810!important;}
.dcb4{border-color:#22d3ee!important;background:#002828!important;}
.dcb5{border-color:#818cf8!important;background:#080028!important;}
.dcb6{border-color:#f472b6!important;background:#280018!important;}
.dcb7{border-color:#34d399!important;background:#002820!important;}
.dcb8{border-color:#60a5fa!important;background:#001828!important;}
.dcb9{border-color:#c084fc!important;background:#180028!important;}
.dcb10{border-color:#fca5a5!important;background:#280800!important;}
.dcb11{border-color:#86efac!important;background:#002818!important;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{display:flex;flex-direction:column;font-family:var(--sans);color:var(--text);touch-action:manipulation;}

/* ── HEADER ── */
#header{
  display:flex;align-items:center;justify-content:space-between;
  padding:3px 10px;background:var(--panel);
  border-bottom:1px solid var(--card-b);flex-shrink:0;height:30px;
}
#logo{font-size:.65rem;font-weight:700;letter-spacing:.15em;color:var(--gold);display:flex;align-items:center;gap:8px;}
#dupe-alert{
  font-size:.54rem;color:#f43f5e;display:none;
  animation:blink 1.2s step-end infinite;
  background:rgba(244,63,94,.1);border:1px solid #f43f5e;
  border-radius:3px;padding:1px 5px;
}
#dupe-alert.show{display:inline-block;}
#clock{font-family:var(--mono);font-size:.7rem;color:var(--muted);}

#body{display:flex;flex:1;overflow:hidden;}

/* ── CAST PANEL ── */
#cast-panel{
  width:66px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--card-b);
  display:flex;flex-direction:column;overflow:hidden;
}
#cast-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 4px 3px;border-bottom:1px solid var(--card-b);flex-shrink:0;
}
#cast-title{font-size:.48rem;letter-spacing:.18em;color:var(--gold);}
#add-cast-btn{
  background:transparent;border:1px solid var(--gold);
  border-radius:3px;color:var(--gold);cursor:pointer;
  font-size:.68rem;line-height:1;padding:0 3px 1px;
}
#cast-list{flex:1;overflow-y:auto;padding:3px;display:flex;flex-direction:column;gap:2px;}
#cast-list::-webkit-scrollbar{width:3px;}
#cast-list::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}
.cast-chip{
  background:#1a1a28;border:1px solid var(--card-b);
  border-radius:4px;padding:3px 2px;
  font-size:.6rem;color:var(--text);
  cursor:grab;text-align:center;
  transition:color .2s,border-color .2s,background .2s;
  line-height:1.2;
}
.cast-chip:active{cursor:grabbing;opacity:.8;}
.cast-chip.dragging{opacity:.35;}

/* ── GRID ── */
#main{flex:1;padding:4px;overflow:hidden;}
#grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(7,1fr);
  gap:3px;width:100%;height:100%;
}

/* ── CARD ──
  列順: [卓番号+人数] | [入店時間+入店ボタン] | [タイマー] | [本指名] | [場内指名]
*/
.card{
  background:var(--card);border:1px solid var(--card-b);
  border-radius:5px;
  display:flex;flex-direction:row;align-items:stretch;
  position:relative;overflow:hidden;
  transition:background .35s,border-color .35s;
  min-height:0;
}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,transparent 55%);
  pointer-events:none;z-index:0;
}
.card>*{position:relative;z-index:1;}
.card.warn{background:var(--warn-bg);border-color:var(--warn);}
.card.dead{background:var(--dead-bg);border-color:var(--dead);}
.card.ext{background:var(--ext-bg);border-color:var(--ext);}
.card.active-checkin{background:var(--checkin);border-color:var(--checkin-b);}

/* セクション共通 */
.sec{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2px 3px;border-right:1px solid var(--card-b);
  flex-shrink:0;min-width:0;gap:1px;
}
.sec:last-child{border-right:none;}
.sec-label{
  font-size:.36rem;color:var(--muted);letter-spacing:.05em;
  line-height:1;white-space:nowrap;
}

/* ── 卓番号+人数 ── */
.sec-num{width:30px;}
.tnum{font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--gold);line-height:1;}
.pax-row{display:flex;align-items:center;gap:2px;}
.pax-label{font-size:.36rem;color:var(--muted);}
.pax-btn{
  background:transparent;border:none;color:var(--muted);
  cursor:pointer;font-size:.6rem;line-height:1;padding:0 1px;
}
.pax-btn:hover{color:var(--gold);}
.pax-val{
  font-family:var(--mono);font-size:.65rem;font-weight:700;
  color:var(--text);min-width:12px;text-align:center;
}
.pax-val.has-pax{color:var(--gold);}

/* ── 入店時間+入店ボタン ── */
.sec-checkin{width:44px;}
.checkin-btn{
  font-size:.5rem;font-weight:700;letter-spacing:.03em;
  padding:3px 4px;border-radius:4px;cursor:pointer;
  border:1px solid var(--checkin-b);
  background:rgba(59,130,246,.15);color:#93c5fd;
  transition:background .2s,transform .1s;
  white-space:nowrap;width:100%;text-align:center;
}
.checkin-btn:hover{background:rgba(59,130,246,.28);}
.checkin-btn:active{transform:scale(.94);}
.checkin-btn.checked{
  border-color:var(--ext);background:rgba(34,197,94,.15);color:#86efac;
}
.entry-time-disp{
  font-family:var(--mono);font-size:.65rem;color:var(--text);
  text-align:center;cursor:pointer;
  border:1px solid transparent;border-radius:3px;padding:0 2px;
  transition:border-color .15s,background .15s;
  white-space:nowrap;
}
.entry-time-disp:hover{border-color:var(--gold);background:rgba(201,168,76,.08);}
.entry-time-disp.empty{color:var(--muted);}

/* ── タイマー ── */
.sec-timer{width:72px;}
.timer-inner{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;}
.mode-btn{
  font-size:.36rem;padding:0 3px;border-radius:2px;
  border:1px solid var(--muted);background:transparent;
  color:var(--muted);cursor:pointer;line-height:1.4;
}
.mode-btn.auto{color:var(--ext);border-color:var(--ext);}
.ext-badge{
  font-size:.34rem;color:var(--ext);border:1px solid var(--ext);
  border-radius:2px;padding:0 2px;
  animation:pulse 1.5s ease-in-out infinite;
}
.tval{
  font-family:var(--mono);font-size:.9rem;font-weight:700;
  color:#b0a8c0;line-height:1;
}
.tval.warn{color:var(--warn);animation:blink .9s step-end infinite;}
.tval.dead{color:var(--dead);}
.timer-btns{display:flex;gap:2px;}
.ibtn{
  background:#1e1e32;border:none;border-radius:3px;
  color:var(--text);cursor:pointer;
  font-size:.58rem;padding:1px 4px;line-height:1.3;
}
.ibtn:active{transform:scale(.92);}
.mode-row{display:flex;align-items:center;gap:3px;}

/* ── 本指名・場内指名 ── */
.sec-names{flex:1;min-width:0;align-items:flex-start;padding:2px 4px;}
.names-label{font-size:.36rem;color:var(--muted);letter-spacing:.05em;line-height:1;align-self:flex-start;}
.names-list{display:flex;flex-wrap:wrap;gap:2px;width:100%;align-content:flex-start;}
.name-tag{
  font-size:.56rem;border-radius:3px;padding:1px 4px;
  border:1px solid var(--card-b);background:#1e1e2e;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;transition:border-color .15s,background .15s,color .2s;
  line-height:1.4;
}
.name-tag:hover{border-color:var(--gold);}
.name-tag.placeholder{color:var(--muted);background:transparent;border-style:dashed;font-size:.5rem;}
.name-tag.placeholder:hover{border-color:var(--gold);background:rgba(201,168,76,.06);}
.name-tag-wrap{display:flex;align-items:center;gap:1px;}
.tag-del{
  font-size:.48rem;color:var(--muted);cursor:pointer;
  padding:0 1px;line-height:1;border:none;background:transparent;
}
.tag-del:hover{color:var(--dead);}
.sec-names.drop-target{background:rgba(201,168,76,.08);outline:1px dashed var(--gold);}

/* ── MODALS ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.82);
  display:none;align-items:center;justify-content:center;
  z-index:200;backdrop-filter:blur(4px);
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:#14141e;border:1px solid var(--gold);
  border-radius:10px;padding:14px;
  width:min(92vw,480px);max-height:82vh;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 0 40px rgba(201,168,76,.15);
}
.modal-title{font-size:.75rem;color:var(--gold);font-weight:700;letter-spacing:.1em;text-align:center;}
.modal-sub{font-size:.58rem;color:var(--muted);text-align:center;margin-top:-4px;}

/* 指名モーダル */
#modal-selected{
  display:flex;flex-wrap:wrap;gap:4px;min-height:26px;
  border:1px solid var(--card-b);border-radius:6px;padding:4px 6px;
  background:#0f0f18;
}
.sel-tag{
  font-size:.66rem;padding:2px 6px;border-radius:4px;
  border:1px solid var(--gold);background:rgba(201,168,76,.1);
  color:var(--gold);display:flex;align-items:center;gap:3px;
}
.sel-tag-del{cursor:pointer;font-size:.58rem;color:var(--muted);}
.sel-tag-del:hover{color:var(--dead);}
.sel-placeholder{font-size:.58rem;color:var(--muted);align-self:center;}
#modal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;overflow-y:auto;max-height:180px;}
#modal-grid::-webkit-scrollbar{width:3px;}
#modal-grid::-webkit-scrollbar-thumb{background:#333;}
.mchip{
  background:#1e1e2e;border:1px solid var(--card-b);
  border-radius:6px;padding:6px 3px;
  font-size:.68rem;color:var(--text);cursor:pointer;text-align:center;
  transition:background .15s,border-color .15s;font-family:var(--sans);
}
.mchip:hover{background:#28283c;border-color:var(--gold);}
.mchip.selected{border-color:var(--gold);background:rgba(201,168,76,.15);color:var(--gold);}
.modal-actions{display:flex;gap:8px;}
.modal-ok{
  flex:2;background:linear-gradient(135deg,#7a6230,#c9a84c);
  border:none;border-radius:6px;color:#0a0a0f;
  cursor:pointer;padding:7px;font-size:.72rem;font-weight:700;font-family:var(--sans);
}
.modal-cancel-btn{
  flex:1;background:#1a1a28;border:1px solid var(--muted);
  border-radius:6px;color:var(--muted);
  cursor:pointer;padding:7px;font-size:.72rem;font-family:var(--sans);
}

/* 入店・人数モーダル */
#checkin-modal .modal-box{width:min(90vw,360px);}
.checkin-now-btn{
  width:100%;padding:14px;font-size:1rem;font-weight:700;
  background:linear-gradient(135deg,#1e3a5f,#3b82f6);
  border:1px solid #3b82f6;border-radius:8px;
  color:#fff;cursor:pointer;letter-spacing:.1em;
  font-family:var(--sans);
  transition:opacity .2s,transform .1s;
}
.checkin-now-btn:active{transform:scale(.97);opacity:.85;}
.pax-select-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.pax-opt{
  background:#1e1e2e;border:1px solid var(--card-b);
  border-radius:8px;padding:8px 12px;
  font-size:.8rem;font-family:var(--mono);color:var(--text);
  cursor:pointer;min-width:40px;text-align:center;
  transition:border-color .15s,background .15s;
}
.pax-opt:hover{border-color:var(--gold);background:#28283c;}
.pax-opt.selected{border-color:var(--gold);background:rgba(201,168,76,.2);color:var(--gold);}
.divider-line{border:none;border-top:1px solid var(--card-b);}
.checkin-manual-row{display:flex;gap:6px;align-items:center;}
#time-custom-input{
  flex:1;background:#1a1a28;border:1px solid var(--card-b);
  border-radius:6px;padding:7px;
  font-size:.8rem;font-family:var(--mono);color:var(--text);outline:none;
}
#time-custom-input:focus{border-color:var(--gold);}
#time-custom-set{
  background:rgba(201,168,76,.2);border:1px solid var(--gold);
  border-radius:6px;color:var(--gold);cursor:pointer;
  padding:7px 10px;font-size:.66rem;font-family:var(--sans);
}
#time-clear-btn{
  background:#220000;border:1px solid var(--dead);
  border-radius:6px;color:var(--dead);
  cursor:pointer;padding:7px;font-size:.66rem;font-family:var(--sans);
  width:100%;
}

/* キャスト追加 */
#new-cast-input{
  background:#1a1a28;border:1px solid var(--card-b);
  border-radius:6px;padding:9px;
  font-size:.85rem;color:var(--text);font-family:var(--sans);outline:none;
  transition:border-color .2s;width:100%;
}
#new-cast-input:focus{border-color:var(--gold);}
#add-cast-confirm{
  background:linear-gradient(135deg,#7a6230,#c9a84c);
  border:none;border-radius:6px;color:#0a0a0f;cursor:pointer;
  padding:8px;font-size:.75rem;font-weight:700;font-family:var(--sans);width:100%;
}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ext-flash{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}
  70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
}
.card.ext-anim{animation:ext-flash .7s ease-out 3;}
@keyframes checkin-flash{
  0%{box-shadow:0 0 0 0 rgba(59,130,246,.7)}
  70%{box-shadow:0 0 0 10px rgba(59,130,246,0)}
  100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}
}
.card.checkin-anim{animation:checkin-flash .5s ease-out 2;}
</style>
</head>
<body>

<div id="header">
  <div id="logo">◆ 付け回し管理 <span id="dupe-alert">⚠ 指名被り</span></div>
  <div id="clock"></div>
</div>

<div id="body">
  <div id="cast-panel">
    <div id="cast-header">
      <span id="cast-title">CAST</span>
      <button id="add-cast-btn" title="キャスト追加">＋</button>
    </div>
    <div id="cast-list"></div>
  </div>
  <div id="main"><div id="grid"></div></div>
</div>

<!-- 指名選択モーダル -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub">複数選択可 · タップで選択／解除</div>
    <div id="modal-selected"><span class="sel-placeholder">キャストを選択してください</span></div>
    <div id="modal-grid"></div>
    <div class="modal-actions">
      <button class="modal-ok" id="modal-ok">決定</button>
      <button class="modal-cancel-btn" id="modal-cancel">キャンセル</button>
    </div>
  </div>
</div>

<!-- 入店・人数モーダル -->
<div class="modal-overlay" id="checkin-modal">
  <div class="modal-box" style="width:min(90vw,360px);">
    <div class="modal-title" id="checkin-modal-title">入店  —  1卓</div>

    <button class="checkin-now-btn" id="checkin-now-btn">
      ▶ 今すぐ入店
    </button>

    <hr class="divider-line">

    <div class="sec-label" style="text-align:center;font-size:.6rem;color:var(--muted);">人数</div>
    <div class="pax-select-row" id="pax-select-row">
      <!-- JS生成 -->
    </div>

    <hr class="divider-line">

    <div class="sec-label" style="text-align:center;font-size:.6rem;color:var(--muted);margin-bottom:2px;">時刻を指定して入店</div>
    <div class="checkin-manual-row">
      <input id="time-custom-input" type="time">
      <button id="time-custom-set">セット</button>
    </div>
    <button id="time-clear-btn">クリア（入店取消）</button>

    <div class="modal-actions">
      <button class="modal-cancel-btn" id="checkin-cancel">閉じる</button>
    </div>
  </div>
</div>

<!-- キャスト追加モーダル -->
<div class="modal-overlay" id="add-cast-overlay">
  <div class="modal-box" style="width:min(90vw,300px);">
    <div class="modal-title">キャスト追加</div>
    <input id="new-cast-input" type="text" placeholder="キャスト名（8文字以内）" maxlength="8">
    <button id="add-cast-confirm">追加する</button>
    <div class="modal-actions"><button class="modal-cancel-btn" id="add-cast-cancel">キャンセル</button></div>
  </div>
</div>

<script>
// ── 定数 ─────────────────────────────────────────────
const TABLE_COUNT  = 28;
const INIT_SEC     = 3600;
const WARN_SEC     = 600;
const AUTO_EXT_SEC = 4200;
const DUPE_N       = 12;
const PAX_MAX      = 10;

let casts = [
  "さくら","ひな","れい","みゆ","なな","あおい","ゆき","りん",
  "まい","こと","るな","すず","みお","はな","ちか","のあ",
  "えま","かな","らん","しの","あや","ゆな","みか","ねね",
  "りか","もも","ゆい","あみ","はる","せな",
];

// ── テーブル状態 ──────────────────────────────────────
const tables = Array.from({length:TABLE_COUNT},(_,i)=>({
  id: i+1,
  mode: 'time',
  honmei: [],
  banai:  [],
  entryTime: '',   // "HH:MM" 表示用
  pax: 0,          // 人数 0=未設定
  running: false,
  seconds: INIT_SEC,
  savedSec: INIT_SEC,
  startedAt: null,
  extended: false,
}));

let modalState  = null; // {tableId, field, selected:[]}
let checkinId   = null;
let checkinPax  = 0;    // モーダル内の人数選択状態
let dragName    = null;

// ── Utils ─────────────────────────────────────────────
const fmt = s => {
  if(s<=0) return '00:00';
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
};
const nowHHMM = () => {
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
};
function ci(name){
  let h=0;
  for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))&0xffff;
  return h%DUPE_N;
}
function getDupes(){
  const count={};
  tables.forEach(t=>{
    [...t.honmei,...t.banai].forEach(n=>{ count[n]=(count[n]||0)+1; });
  });
  const s=new Set();
  Object.entries(count).forEach(([k,v])=>{ if(v>1) s.add(k); });
  return s;
}

// ── BUILD CASTS ───────────────────────────────────────
function buildCasts(){
  const list=document.getElementById('cast-list');
  list.innerHTML='';
  casts.forEach(name=>{
    const el=document.createElement('div');
    el.className='cast-chip';
    el.textContent=name; el.draggable=true; el.dataset.name=name;
    el.addEventListener('dragstart',e=>{
      dragName=name; e.dataTransfer.effectAllowed='copy';
      setTimeout(()=>el.classList.add('dragging'),0);
    });
    el.addEventListener('dragend',()=>{ dragName=null; el.classList.remove('dragging'); });
    list.appendChild(el);
  });
}

// ── BUILD GRID ────────────────────────────────────────
function buildGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  tables.forEach(t=>{
    const card=document.createElement('div');
    card.className='card'; card.id=`card-${t.id}`;
    card.innerHTML=`
      <!-- 卓番号 + 人数 -->
      <div class="sec sec-num">
        <div class="sec-label">卓</div>
        <div class="tnum">${t.id}</div>
        <div class="pax-row">
          <button class="pax-btn" id="pax-m-${t.id}">－</button>
          <span class="pax-val" id="pax-${t.id}">—</span>
          <button class="pax-btn" id="pax-p-${t.id}">＋</button>
        </div>
      </div>
      <!-- 入店時間 + 入店ボタン -->
      <div class="sec sec-checkin">
        <div class="sec-label">入店</div>
        <button class="checkin-btn" id="cb-${t.id}">入店</button>
        <div class="entry-time-disp empty" id="et-${t.id}">--:--</div>
      </div>
      <!-- タイマー -->
      <div class="sec sec-timer">
        <div class="mode-row">
          <button class="mode-btn" id="mb-${t.id}">TM</button>
          <span class="ext-badge" id="eb-${t.id}" style="display:none">延長</span>
        </div>
        <div class="timer-inner">
          <div class="tval" id="tv-${t.id}">${fmt(INIT_SEC)}</div>
          <div class="timer-btns">
            <button class="ibtn" id="pb-${t.id}">▶</button>
            <button class="ibtn" id="rb-${t.id}" style="font-size:.5rem">↺</button>
          </div>
        </div>
      </div>
      <!-- 本指名 -->
      <div class="sec sec-names" id="honSec-${t.id}" data-tid="${t.id}" data-field="honmei">
        <div class="names-label">本指名</div>
        <div class="names-list" id="honList-${t.id}"></div>
      </div>
      <!-- 場内指名 -->
      <div class="sec sec-names" id="banSec-${t.id}" data-tid="${t.id}" data-field="banai">
        <div class="names-label">場内指名</div>
        <div class="names-list" id="banList-${t.id}"></div>
      </div>
    `;
    grid.appendChild(card);

    // 人数 ± ボタン（直接操作）
    document.getElementById(`pax-m-${t.id}`).addEventListener('click',e=>{
      e.stopPropagation();
      if(t.pax>0) t.pax--;
      renderAll();
    });
    document.getElementById(`pax-p-${t.id}`).addEventListener('click',e=>{
      e.stopPropagation();
      if(t.pax<PAX_MAX) t.pax++;
      renderAll();
    });

    // 入店ボタン → モーダル
    document.getElementById(`cb-${t.id}`).addEventListener('click',e=>{
      e.stopPropagation();
      openCheckinModal(t.id);
    });
    // 入店時間表示をタップ → 同じモーダル
    document.getElementById(`et-${t.id}`).addEventListener('click',e=>{
      e.stopPropagation();
      openCheckinModal(t.id);
    });

    // モードボタン
    document.getElementById(`mb-${t.id}`).addEventListener('click',()=>toggleMode(t.id));
    // タイマーボタン
    document.getElementById(`pb-${t.id}`).addEventListener('click',()=>toggleTimer(t.id));
    document.getElementById(`rb-${t.id}`).addEventListener('click',()=>resetTable(t.id));

    // 指名セクション
    ['honSec','banSec'].forEach(p=>{
      const sec=document.getElementById(`${p}-${t.id}`);
      const field=sec.dataset.field;
      sec.addEventListener('click',e=>{
        if(!e.target.classList.contains('tag-del')) openModal(t.id,field);
      });
      sec.addEventListener('dragover',e=>{ e.preventDefault(); sec.classList.add('drop-target'); });
      sec.addEventListener('dragleave',()=>sec.classList.remove('drop-target'));
      sec.addEventListener('drop',e=>{
        e.preventDefault(); sec.classList.remove('drop-target');
        if(dragName) addNameToField(t.id,field,dragName);
      });
    });
  });
}

// ── 入店モーダル ──────────────────────────────────────
function buildPaxSelectRow(){
  const row=document.getElementById('pax-select-row');
  row.innerHTML='';
  for(let i=1;i<=PAX_MAX;i++){
    const btn=document.createElement('button');
    btn.className='pax-opt'+(checkinPax===i?' selected':'');
    btn.textContent=`${i}名`;
    btn.addEventListener('click',()=>{
      checkinPax=i;
      buildPaxSelectRow();
    });
    row.appendChild(btn);
  }
}

function openCheckinModal(id){
  checkinId=id;
  const t=tables[id-1];
  checkinPax=t.pax>0?t.pax:0;
  document.getElementById('checkin-modal-title').textContent=`入店  —  ${id}卓`;
  // 入店済みならボタンを変える
  const nowBtn=document.getElementById('checkin-now-btn');
  nowBtn.textContent=t.entryTime?`▶ 再入店（現在: ${t.entryTime}）`:'▶ 今すぐ入店';
  // time inputに現在値or現在時刻
  document.getElementById('time-custom-input').value=t.entryTime||nowHHMM();
  buildPaxSelectRow();
  document.getElementById('checkin-modal').classList.add('show');
}

// 今すぐ入店ボタン
document.getElementById('checkin-now-btn').addEventListener('click',()=>{
  if(checkinId===null) return;
  doCheckin(checkinId, nowHHMM());
});
// 時刻指定セット
document.getElementById('time-custom-set').addEventListener('click',()=>{
  const v=document.getElementById('time-custom-input').value;
  if(v && checkinId!==null) doCheckin(checkinId, v);
});
// クリア（入店取消）
document.getElementById('time-clear-btn').addEventListener('click',()=>{
  if(checkinId===null) return;
  const t=tables[checkinId-1];
  t.entryTime='';
  t.pax=checkinPax>0?checkinPax:t.pax;
  // タイマー停止・リセット
  t.running=false; t.seconds=INIT_SEC; t.savedSec=INIT_SEC; t.startedAt=null; t.extended=false;
  document.getElementById(`pb-${checkinId}`).textContent='▶';
  document.getElementById(`eb-${checkinId}`).style.display='none';
  document.getElementById('checkin-modal').classList.remove('show');
  checkinId=null; renderAll();
});
document.getElementById('checkin-cancel').addEventListener('click',()=>{
  // 人数だけ反映して閉じる
  if(checkinId!==null && checkinPax>0) tables[checkinId-1].pax=checkinPax;
  document.getElementById('checkin-modal').classList.remove('show');
  checkinId=null; renderAll();
});
document.getElementById('checkin-modal').addEventListener('click',e=>{
  if(e.target.id==='checkin-modal'){
    if(checkinId!==null && checkinPax>0) tables[checkinId-1].pax=checkinPax;
    document.getElementById('checkin-modal').classList.remove('show');
    checkinId=null; renderAll();
  }
});

function doCheckin(id, timeStr){
  const t=tables[id-1];
  t.entryTime=timeStr;
  if(checkinPax>0) t.pax=checkinPax;
  // タイマー起動（停止中のみ）
  if(!t.running){
    t.running=true; t.startedAt=Date.now();
    document.getElementById(`pb-${id}`).textContent='⏸';
  }
  // フラッシュ演出
  const card=document.getElementById(`card-${id}`);
  card.classList.add('checkin-anim');
  setTimeout(()=>card.classList.remove('checkin-anim'),1200);
  document.getElementById('checkin-modal').classList.remove('show');
  checkinId=null; renderAll();
}

// ── テーブル操作 ─────────────────────────────────────
function toggleMode(id){
  const t=tables[id-1];
  t.mode=t.mode==='time'?'auto':'time'; t.extended=false;
  const btn=document.getElementById(`mb-${id}`);
  btn.textContent=t.mode==='auto'?'AU':'TM';
  btn.className='mode-btn'+(t.mode==='auto'?' auto':'');
  document.getElementById(`eb-${id}`).style.display='none';
  updateCardStyle(t);
}
function toggleTimer(id){
  const t=tables[id-1];
  if(t.running){
    t.savedSec=Math.max(0,t.savedSec-Math.floor((Date.now()-t.startedAt)/1000));
    t.seconds=t.savedSec; t.running=false; t.startedAt=null;
  } else {
    t.running=true; t.startedAt=Date.now();
  }
  document.getElementById(`pb-${id}`).textContent=t.running?'⏸':'▶';
}
function resetTable(id){
  const t=tables[id-1];
  Object.assign(t,{
    running:false,seconds:INIT_SEC,savedSec:INIT_SEC,
    startedAt:null,extended:false,
    honmei:[],banai:[],entryTime:'',pax:0,
  });
  document.getElementById(`pb-${id}`).textContent='▶';
  document.getElementById(`eb-${id}`).style.display='none';
  renderAll();
}
function addNameToField(id,field,name){
  const arr=tables[id-1][field];
  if(!arr.includes(name)) arr.push(name);
  renderAll();
}
function removeNameFromField(id,field,name){
  const t=tables[id-1];
  t[field]=t[field].filter(n=>n!==name);
  renderAll();
}

// ── 指名モーダル ───────────────────────────────────────
function openModal(tableId,field){
  const t=tables[tableId-1];
  modalState={tableId, field, selected:[...t[field]]};
  const label=field==='honmei'?'本指名':'場内指名';
  document.getElementById('modal-title').textContent=`${label}  —  ${tableId}卓`;
  refreshModalGrid();
  document.getElementById('modal-overlay').classList.add('show');
}
function refreshModalGrid(){
  const dupes=getDupes();
  const selDiv=document.getElementById('modal-selected');
  selDiv.innerHTML='';
  if(modalState.selected.length===0){
    selDiv.innerHTML='<span class="sel-placeholder">キャストを選択してください</span>';
  } else {
    modalState.selected.forEach(name=>{
      const tag=document.createElement('span');
      tag.className='sel-tag';
      if(dupes.has(name)) tag.classList.add(`dc${ci(name)}`);
      tag.innerHTML=`${name}<span class="sel-tag-del" data-name="${name}">×</span>`;
      tag.querySelector('.sel-tag-del').addEventListener('click',e=>{
        e.stopPropagation();
        modalState.selected=modalState.selected.filter(n=>n!==name);
        refreshModalGrid();
      });
      selDiv.appendChild(tag);
    });
  }
  const mg=document.getElementById('modal-grid');
  mg.innerHTML='';
  casts.forEach(name=>{
    const btn=document.createElement('button');
    const isSel=modalState.selected.includes(name);
    btn.className='mchip'+(isSel?' selected':'');
    btn.textContent=name; btn.dataset.name=name;
    for(let i=0;i<DUPE_N;i++) btn.classList.remove(`dc${i}`);
    if(dupes.has(name)&&!isSel) btn.classList.add(`dc${ci(name)}`);
    btn.addEventListener('click',()=>{
      if(modalState.selected.includes(name)){
        modalState.selected=modalState.selected.filter(n=>n!==name);
      } else { modalState.selected.push(name); }
      refreshModalGrid();
    });
    mg.appendChild(btn);
  });
}
document.getElementById('modal-ok').addEventListener('click',()=>{
  if(!modalState) return;
  tables[modalState.tableId-1][modalState.field]=[...modalState.selected];
  modalState=null;
  document.getElementById('modal-overlay').classList.remove('show');
  renderAll();
});
document.getElementById('modal-cancel').addEventListener('click',()=>{
  modalState=null; document.getElementById('modal-overlay').classList.remove('show');
});
document.getElementById('modal-overlay').addEventListener('click',e=>{
  if(e.target.id==='modal-overlay'){
    modalState=null; document.getElementById('modal-overlay').classList.remove('show');
  }
});

// ── キャスト追加 ──────────────────────────────────────
document.getElementById('add-cast-btn').addEventListener('click',()=>{
  document.getElementById('new-cast-input').value='';
  document.getElementById('add-cast-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('new-cast-input').focus(),100);
});
document.getElementById('add-cast-cancel').addEventListener('click',()=>{
  document.getElementById('add-cast-overlay').classList.remove('show');
});
document.getElementById('add-cast-overlay').addEventListener('click',e=>{
  if(e.target.id==='add-cast-overlay') document.getElementById('add-cast-overlay').classList.remove('show');
});
document.getElementById('add-cast-confirm').addEventListener('click',addCast);
document.getElementById('new-cast-input').addEventListener('keydown',e=>{ if(e.key==='Enter') addCast(); });
function addCast(){
  const inp=document.getElementById('new-cast-input');
  const name=inp.value.trim();
  if(!name||casts.includes(name)){
    inp.style.borderColor='#ef4444';
    setTimeout(()=>inp.style.borderColor='',800); return;
  }
  casts.push(name); buildCasts(); renderAll();
  document.getElementById('add-cast-overlay').classList.remove('show');
}

// ── RENDER ────────────────────────────────────────────
function updateCardStyle(t){
  const card=document.getElementById(`card-${t.id}`);
  const isWarn=t.mode==='time'&&t.running&&t.seconds<=WARN_SEC&&t.seconds>0;
  const isDead=t.mode==='time'&&t.running&&t.seconds===0;
  const isActive=t.entryTime&&!isWarn&&!isDead&&!t.extended;
  const hasAnim=card.classList.contains('ext-anim')||card.classList.contains('checkin-anim');
  let cls='card';
  if(isWarn) cls+=' warn';
  else if(isDead) cls+=' dead';
  else if(t.extended) cls+=' ext';
  else if(isActive) cls+=' active-checkin';
  if(hasAnim) cls+=' '+(card.classList.contains('ext-anim')?'ext-anim':'checkin-anim');
  card.className=cls;

  const tv=document.getElementById(`tv-${t.id}`);
  tv.className='tval'+(isWarn?' warn':isDead?' dead':'');
  tv.textContent=fmt(t.seconds);

  // 入店ボタン見た目
  const cb=document.getElementById(`cb-${t.id}`);
  cb.className='checkin-btn'+(t.entryTime?' checked':'');
  cb.textContent=t.entryTime?'✔ 入店済':'入店';

  // 入店時間
  const et=document.getElementById(`et-${t.id}`);
  et.textContent=t.entryTime||'--:--';
  et.className='entry-time-disp'+(t.entryTime?'':' empty');

  // 人数
  const paxEl=document.getElementById(`pax-${t.id}`);
  paxEl.textContent=t.pax>0?`${t.pax}名`:'—';
  paxEl.className='pax-val'+(t.pax>0?' has-pax':'');
}

function updateCardNames(t, dupes){
  [['honList','honmei'],['banList','banai']].forEach(([listId,field])=>{
    const ul=document.getElementById(`${listId}-${t.id}`);
    ul.innerHTML='';
    const arr=t[field];
    if(arr.length===0){
      const ph=document.createElement('span');
      ph.className='name-tag placeholder';
      ph.textContent='タップ/ドロップ';
      ul.appendChild(ph);
    } else {
      arr.forEach(name=>{
        const wrap=document.createElement('div');
        wrap.className='name-tag-wrap';
        const tag=document.createElement('span');
        tag.className='name-tag';
        tag.textContent=name;
        for(let i=0;i<DUPE_N;i++) tag.classList.remove(`dc${i}`);
        if(dupes.has(name)) tag.classList.add(`dc${ci(name)}`);
        const del=document.createElement('button');
        del.className='tag-del'; del.textContent='×';
        del.addEventListener('click',e=>{ e.stopPropagation(); removeNameFromField(t.id,field,name); });
        wrap.appendChild(tag); wrap.appendChild(del);
        ul.appendChild(wrap);
      });
    }
  });
}

function renderAll(){
  const dupes=getDupes();
  document.querySelectorAll('.cast-chip').forEach(el=>{
    const name=el.dataset.name;
    for(let i=0;i<DUPE_N;i++) el.classList.remove(`dc${i}`,`dcb${i}`);
    if(dupes.has(name)){ el.classList.add(`dc${ci(name)}`,`dcb${ci(name)}`); }
  });
  document.getElementById('dupe-alert').classList.toggle('show',dupes.size>0);
  tables.forEach(t=>{ updateCardStyle(t); updateCardNames(t,dupes); });
  if(modalState) refreshModalGrid();
}

// ── TIMER LOOP ────────────────────────────────────────
setInterval(()=>{
  tables.forEach(t=>{
    if(!t.running||!t.startedAt) return;
    let s=t.savedSec-Math.floor((Date.now()-t.startedAt)/1000);
    if(t.mode==='auto'&&s<=WARN_SEC&&!t.extended){
      t.extended=true; t.savedSec=AUTO_EXT_SEC; t.startedAt=Date.now(); s=AUTO_EXT_SEC;
      const card=document.getElementById(`card-${t.id}`);
      card.classList.add('ext-anim');
      setTimeout(()=>card.classList.remove('ext-anim'),2200);
      document.getElementById(`eb-${t.id}`).style.display='inline';
    }
    t.seconds=Math.max(0,s);
  });
  renderAll();
},1000);

// ── CLOCK ─────────────────────────────────────────────
const tickClock=()=>{
  document.getElementById('clock').textContent=
    new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
};
setInterval(tickClock,1000); tickClock();

buildCasts(); buildGrid(); renderAll();
</script>
</body>
</html>
